<!-- ==========================================================================
     Fantasy Sports Legends — NodeBB ad slot HTML
     Paste into: ACP > Extend > Widgets  (drag an "HTML" widget into a zone)
     Zones that work well: Global Header, Category Sidebar, Global Footer.
     The .fsl-ad classes are styled by nodebb-fsl-theme.css.
     ========================================================================== -->

<!-- 1. Leaderboard 728x90 — put in the Global Header or Category Header zone -->
<div class="fsl-ad fsl-ad--leaderboard">
  <span class="fsl-ad-label">Sponsored</span>
  <!-- PASTE AD CODE BELOW -->
  <!-- Google AdSense example:
  <ins class="adsbygoogle"
       style="display:inline-block;width:728px;height:90px"
       data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
       data-ad-slot="1234567890"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  -->
  <!-- House banner example:
  <a href="https://your-sponsor.example"><img src="/assets/uploads/files/sponsor-728x90.png" alt="Sponsor"></a>
  -->
</div>

<!-- 2. Rectangle 300x250 — put in a Sidebar zone -->
<div class="fsl-ad fsl-ad--rectangle">
  <span class="fsl-ad-label">Sponsored</span>
  <!-- PASTE AD CODE BELOW -->
</div>

<!-- 3. Footer banner — put in the Global Footer zone -->
<div class="fsl-ad fsl-ad--leaderboard">
  <span class="fsl-ad-label">Sponsored</span>
  <!-- PASTE AD CODE BELOW -->
</div>

<!-- If you use AdSense, also add the loader script ONCE in
     ACP > Appearance > Custom HTML & CSS > Custom Header:
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
-->
